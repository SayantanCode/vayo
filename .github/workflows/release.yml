name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Explicit rather than relying on the (also-false) default: a second push
  # landing while a publish is mid-flight must queue behind it, never cancel
  # it — cancelling a real `npm publish` partway through is exactly the kind
  # of "now what state is this in" mess this whole setup is trying to avoid.
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: write
      pull-requests: write
      # Lets this job mint the short-lived OIDC token npm's Trusted
      # Publishing exchanges for a real publish credential — no
      # NPM_TOKEN/NODE_AUTH_TOKEN secret needed, ever, as long as each
      # package has a matching Trusted Publisher configured on npmjs.com
      # (repo: SayantanCode/vayo, workflow: this exact file path).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Newer than the rest of the repo's Node 20 baseline (packages'
          # own `engines.node: >=20` is a consumer-facing requirement, not a
          # constraint on what builds/publishes them) — found the hard way:
          # npm 11/12 itself now requires Node >=22.22.2, and 24 is the
          # version actually confirmed to run OIDC trusted publishing
          # reliably in practice, not just the minimum that satisfies npm's
          # own engine check.
          node-version: 24
          cache: pnpm
          # Required for npm's OIDC trusted-publish exchange to target the
          # right registry — without this, `npm publish` has nothing to
          # authenticate the minted OIDC token against.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing's OIDC token exchange needs npm >= 11.5.1 — newer
      # than what Node 20's bundled npm ships. Pinned to a specific 11.x
      # version rather than `npm@latest` deliberately: npm 12 (verified live,
      # 2026-07-26) made an unknown CLI flag a hard EUNKNOWNCONFIG error
      # instead of just a warning, and `changeset publish` always shells out
      # to `pnpm publish --no-git-checks` — which has a real, open upstream
      # bug (pnpm/pnpm#9646) that mangles `--no-git-checks` into a bare
      # `--git-checks` before forwarding it to the underlying npm call. On
      # npm <12 this was a harmless warning; on npm 12 it's fatal, and it
      # killed every single package's publish the first time this pipeline
      # actually ran for real. Bump this pin only after confirming a newer
      # npm version doesn't reintroduce the same crash.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@11.18.0

      # Publishing stale or missing dist/ output would be worse than not
      # publishing at all — dist/ is gitignored, so a fresh checkout has
      # none until built. Full CI battery repeated here (not just build)
      # as a deliberate second check immediately before a one-way-door
      # action, independent of whatever already passed on the PR itself.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check package boundaries
        run: pnpm check:boundaries

      - name: Test
        run: pnpm test
        env:
          VAYO_TEST_MONGO_URI: mongodb://localhost:27017/vayo_test_dbmongo

      # Maintains a "Version Packages" PR whenever unreleased changesets
      # exist on main — bumping versions and writing changelogs from
      # whatever's accumulated. Once that PR is merged, the push event this
      # workflow reacts to has zero pending changesets left, and
      # changesets/action runs `publish` instead: `pnpm release`
      # (`changeset publish`) auto-detects this is a pnpm workspace and runs
      # `pnpm publish` per package (correctly resolving `workspace:*` to real
      # versions), authenticated entirely via the OIDC exchange above — an
      # ordinary feature-PR merge (which normally adds a changeset) only ever
      # refreshes the Version PR, never triggers a real publish.
      - name: Create/update Version Packages PR, or publish once it's merged
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
